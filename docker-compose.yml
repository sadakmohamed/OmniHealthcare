version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnihealth
      POSTGRES_USER: omnihealth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnihealth"]
      interval: 10s
      timeout: 5s
      retries: 5

  virtualcare-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: virtualcare
      POSTGRES_USER: virtualcare
      POSTGRES_PASSWORD: ${VIRTUALCARE_POSTGRES_PASSWORD:?Set VIRTUALCARE_POSTGRES_PASSWORD in .env}
    volumes:
      - virtualcaredata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtualcare"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://omnihealth:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/omnihealth
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      VIRTUALCARE_SYNC_SECRET: ${VIRTUALCARE_SYNC_SECRET:?Set VIRTUALCARE_SYNC_SECRET in .env}
      VIRTUALCARE_BOOTSTRAP_KEY: ${VIRTUALCARE_BOOTSTRAP_KEY:?Set VIRTUALCARE_BOOTSTRAP_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - staticfiles:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  virtualcare:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VIRTUALCARE_DATABASE_URL: postgresql://virtualcare:${VIRTUALCARE_POSTGRES_PASSWORD:?Set VIRTUALCARE_POSTGRES_PASSWORD in .env}@virtualcare-db:5432/virtualcare
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      VIRTUALCARE_SYNC_SECRET: ${VIRTUALCARE_SYNC_SECRET:?Set VIRTUALCARE_SYNC_SECRET in .env}
      HOSPITAL_IDENTITY_URL: http://backend:8000/api/v1/me/
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,virtualcare}
    depends_on:
      virtualcare-db:
        condition: service_healthy
    networks:
      - internal
    command: >
      sh -c "python virtualcare_service/manage.py migrate --noinput &&
             gunicorn --chdir /app virtualcare_service.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - internal
    volumes:
      - frontend_dist:/app/dist

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/static:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - virtualcare
      - frontend
    networks:
      - internal
      - external

volumes:
  pgdata:
  virtualcaredata:
  staticfiles:
  frontend_dist:

networks:
  internal:
  external:
